<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سباق صواريخ الفضاء - ملك جدول الضرب</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: radial-gradient(circle, #1a1c29 0%, #0d0e15 100%); color: white; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        .game-container { width: 100%; max-width: 600px; height: 100vh; background: rgba(15, 23, 42, 0.95); position: relative; box-shadow: 0 0 30px rgba(79, 70, 229, 0.4); display: flex; flex-direction: column; justify-content: space-between; border-left: 2px solid #334155; border-right: 2px solid #334155; box-sizing: border-box; overflow: hidden; }
        .hud { display: flex; justify-content: space-between; padding: 15px 20px; background: rgba(30, 41, 59, 0.95); font-size: 16px; font-weight: bold; border-bottom: 2px solid #4f46e5; z-index: 10; }
        .hud span { color: #f59e0b; }
        .arena { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
        .question-box { background: rgba(79, 70, 229, 0.9); padding: 10px 30px; border-radius: 12px; font-size: 32px; font-weight: 900; margin-top: 15px; box-shadow: 0 0 20px rgba(79, 70, 229, 0.8); letter-spacing: 2px; z-index: 5; }
        
        /* عناصر النيازك المتحركة نزولاً */
        .falling-asteroid { position: absolute; background: linear-gradient(135deg, #475569, #1e293b); border: 3px solid #64748b; color: white; border-radius: 50%; width: 65px; height: 65px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.6); user-select: none; transition: transform 0.1s; }
        .falling-asteroid:hover { border-color: #f59e0b; transform: scale(1.1); }

        /* الصاروخ المتحرك أفقياً بالأسفل */
        .rocket-ship { position: absolute; bottom: 20px; font-size: 50px; transition: left 0.1s linear; user-select: none; z-index: 5; transform: translateX(-50%); }

        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(13, 14, 21, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 20px; box-sizing: border-box; }
        .modal h1 { color: #ec4899; font-size: 36px; margin-bottom: 10px; }
        .modal p { font-size: 20px; margin-bottom: 20px; color: #cbd5e1; }
        .btn { background: #4f46e5; color: white; border: none; padding: 12px 30px; font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; transition: 0.3s; font-family: 'Cairo'; }
        .btn:hover { background: #4338ca; transform: translateY(-2px); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="game-container" id="gameContainer">
        <!-- شاشة المعلومات العلوية HUD -->
        <div class="hud">
            <div>اللاعب: <span id="playerName">بطل</span></div>
            <div>⏱️ الوقت: <span id="timeLeft">٩٠</span>ث</div>
            <div>🔥 السلسلة: <span id="streakCount">٠</span></div>
            <div>⭐ النقاط: <span id="scoreVal">٠</span></div>
        </div>

        <!-- ساحة اللعب الحركية -->
        <div class="arena" id="arenaBox">
            <div class="question-box" id="questionDisplay">؟ × ؟</div>
            
            <!-- الصاروخ المتحرك أفقياً -->
            <div class="rocket-ship" id="rocketShip" style="left: 50%;">🚀</div>
        </div>

        <!-- شاشة النهاية والنتيجة -->
        <div class="modal hidden" id="gameOverModal">
            <h1>انتهى السباق! 🏆</h1>
            <p id="finalScoreText">لقد جمعت ٠ نقطة</p>
            <p id="saveStatus" style="color: #38bdf8; font-size: 16px;"></p>
            <div style="display: flex; gap: 15px;">
                <button class="btn" onclick="restartGame()">إعادة اللعب 🔄</button>
                <button class="btn" style="background: #059669;" onclick="goToMain()">الرئيسية 🏠</button>
            </div>
        </div>
    </div>

    <script>
        // دالة تحويل الأرقام الإنجليزية إلى الأرقام العربية الهندية
        function toArabicNum(num) {
            const arabicNumbers = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
            return String(num).replace(/\d/g, (d) => arabicNumbers[d]);
        }

        let studentData = JSON.parse(localStorage.getItem('current_student')) || { name: "أحمد (تجريبي)", cls: "٥ب٤" };
        document.getElementById('playerName').textContent = studentData.name;

        let customSettings = JSON.parse(localStorage.getItem('rocket_game_settings')) || {
            gameTime: 90,
            correctPoints: 100,
            wrongPenalty: 30,
            streakCount: 5,
            bonusTime: 30
        };

        let score = 0;
        let timeLeft = customSettings.gameTime;
        let streak = 0;
        let timerInterval = null;
        let gameLoopInterval = null;
        let currentCorrectAnswer = 0;
        let maxTable = 10;
        let rocketX = 300; // موضع الصاروخ الأفقي
        let asteroids = []; // مصفوفة النيازك المتحركة

        // التحكم بحركة الصاروخ يميناً ويساراً بالماوس أو اللمس أو الأسهم
        const container = document.getElementById('gameContainer');
        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            rocketX = e.clientX - rect.left;
            if (rocketX < 40) rocketX = 40;
            if (rocketX > rect.width - 40) rocketX = rect.width - 40;
            document.getElementById('rocketShip').style.left = rocketX + 'px';
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') rocketX = Math.max(40, rocketX - 30);
            if (e.key === 'ArrowLeft') rocketX = Math.min(container.clientWidth - 40, rocketX + 30);
            document.getElementById('rocketShip').style.left = rocketX + 'px';
        });

        function initGameSettings() {
            const cls = String(studentData.cls || '').trim();
            if (cls.includes('٤') || cls.includes('4') || cls.startsWith('4')) {
                maxTable = 6;
            } else if (cls.includes('٥') || cls.includes('5') || cls.includes('٦') || cls.includes('6')) {
                maxTable = 12;
            } else {
                maxTable = 10;
            }
            startGameEngine();
        }

        function startGameEngine() {
            score = 0;
            timeLeft = customSettings.gameTime;
            streak = 0;
            updateHUD();
            document.getElementById('gameOverModal').classList.add('hidden');
            
            // إزالة أي نيازك قديمة
            asteroids.forEach(ast => ast.element.remove());
            asteroids = [];

            generateNewWave();

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                updateHUD();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    clearInterval(gameLoopInterval);
                    endGame();
                }
            }, 1000);

            if (gameLoopInterval) clearInterval(gameLoopInterval);
            gameLoopInterval = setInterval(updatePhysics, 30); // تحديث حركة النيازك كل 30 ملي ثانية
        }

        function updateHUD() {
            document.getElementById('scoreVal').textContent = toArabicNum(score);
            document.getElementById('timeLeft').textContent = toArabicNum(timeLeft);
            document.getElementById('streakCount').textContent = toArabicNum(streak);
        }

        function generateNewWave() {
            // إزالة النيازك الحالية إن وجدت
            asteroids.forEach(ast => ast.element.remove());
            asteroids = [];

            let num1 = Math.floor(Math.random() * (maxTable - 1)) + 2;
            let num2 = Math.floor(Math.random() * 10) + 1;
            currentCorrectAnswer = num1 * num2;

            document.getElementById('questionDisplay').textContent = `${toArabicNum(num1)} × ${toArabicNum(num2)}`;

            // توليد 3 نيازك بقيم مختلفة (صحيحة وخاطئة) مع مواقع أفقية متفرقة
            let options = [currentCorrectAnswer];
            while (options.length < 3) {
                let wrong = currentCorrectAnswer + (Math.floor(Math.random() * 11) - 5);
                if (wrong > 0 && !options.includes(wrong)) {
                    options.push(wrong);
                }
            }
            options.sort(() => Math.random() - 0.5);

            const arena = document.getElementById('arenaBox');
            const arenaWidth = arena.clientWidth || 500;

            options.forEach((opt, index) => {
                let astEl = document.createElement('div');
                astEl.className = 'falling-asteroid';
                astEl.textContent = toArabicNum(opt);
                
                let startX = 80 + (index * (arenaWidth / 3));
                let startY = 80 + (Math.random() * 30);
                
                astEl.style.left = startX + 'px';
                astEl.style.top = startY + 'px';
                arena.appendChild(astEl);

                asteroids.push({
                    element: astEl,
                    x: startX,
                    y: startY,
                    speed: 1.2 + Math.random() * 0.8, // سرعة نزول تدريجية الحيوية
                    value: opt
                });

                // النقر المباشر على النيزك كخيار بديل وسريع
                astEl.onclick = () => checkAnswer(opt);
            });
        }

        // تحديث حركة النيازك إلى الأسفل واكتشاف الاصطدام بالصاروخ
        function updatePhysics() {
            const arenaHeight = document.getElementById('arenaBox').clientHeight || 600;
            
            asteroids.forEach(ast => {
                ast.y += ast.speed;
                ast.element.style.top = ast.y + 'px';

                // إذا وصل النيزك لأسفل الشاشة يعود للأعلى بموجة جديدة
                if (ast.y > arenaHeight - 120) {
                    generateNewWave();
                }

                // التحقق من اصطدام الصاروخ المتحرك بالنيزك
                let rocketLeft = rocketX - 25;
                let rocketRight = rocketX + 25;
                if (ast.y >= arenaHeight - 140 && ast.x >= rocketLeft - 30 && ast.x <= rocketRight + 30) {
                    checkAnswer(ast.value);
                }
            });
        }

        function checkAnswer(selectedOpt) {
            if (selectedOpt === currentCorrectAnswer) {
                score += customSettings.correctPoints + (streak * 10);
                streak++;

                if (streak > 0 && streak % customSettings.streakCount === 0) {
                    timeLeft += customSettings.bonusTime;
                    alert(`🔥 أداء مبهر! حصلت على +${toArabicNum(customSettings.bonusTime)} ثوانٍ إضافية.`);
                }
                generateNewWave(); // توليد موجة جديدة مباشرة عند الإصابة الصحيحة
            } else {
                score = Math.max(0, score - customSettings.wrongPenalty);
                streak = 0;
            }
            updateHUD();
        }

        async function endGame() {
            document.getElementById('gameOverModal').classList.remove('hidden');
            document.getElementById('finalScoreText').textContent = `أحسنت يا ${studentData.name}! لقد جمعت ${toArabicNum(score)} نقطة.`;
            document.getElementById('saveStatus').textContent = 'جاري حفظ النتيجة في سحابة مدرسة اليرموك...';

            try {
                const { error } = await supabaseClient.from('scores').insert([{
                    student_name: studentData.name,
                    student_class: studentData.cls,
                    grade: studentData.cls,
                    game_name: 'سباق صواريخ الفضاء',
                    score: score
                }]);

                if (error) throw error;
                document.getElementById('saveStatus').textContent = '✅ تم حفظ النتيجة بنجاح في السحابة!';
            } catch (err) {
                console.error("Save Score Error:", err);
                document.getElementById('saveStatus').textContent = '⚠️ حدث خطأ أثناء الحفظ بالسحابة.';
            }
        }

        function restartGame() {
            startGameEngine();
        }

        function goToMain() {
            window.location.href = 'student.html';
        }

        window.onload = function() {
            initGameSettings();
        };
    </script>
</body>
</html>
