<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سباق صواريخ الفضاء - ملك جدول الضرب</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: radial-gradient(circle, #1a1c29 0%, #0d0e15 100%); color: white; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        .game-container { width: 100%; max-width: 600px; height: 100vh; background: rgba(15, 23, 42, 0.95); position: relative; box-shadow: 0 0 30px rgba(79, 70, 229, 0.4); display: flex; flex-direction: column; justify-content: space-between; border-left: 2px solid #334155; border-right: 2px solid #334155; box-sizing: border-box; }
        .hud { display: flex; justify-content: space-between; padding: 15px 20px; background: rgba(30, 41, 59, 0.95); font-size: 16px; font-weight: bold; border-bottom: 2px solid #4f46e5; z-index: 10; }
        .hud span { color: #f59e0b; }
        .arena { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        .question-box { background: rgba(79, 70, 229, 0.9); padding: 15px 40px; border-radius: 15px; font-size: 40px; font-weight: 900; margin-bottom: 25px; box-shadow: 0 0 25px rgba(79, 70, 229, 0.8); letter-spacing: 2px; }
        .asteroid-container { display: flex; gap: 20px; justify-content: center; width: 100%; margin-top: 20px; }
        .asteroid { background: linear-gradient(135deg, #475569, #1e293b); border: 3px solid #64748b; color: white; border-radius: 50%; width: 85px; height: 85px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.6); user-select: none; }
        .asteroid:hover { transform: scale(1.1); background: linear-gradient(135deg, #64748b, #334155); border-color: #f59e0b; }
        .rocket { font-size: 60px; margin: 15px 0; transition: transform 0.2s; user-select: none; }
        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(13, 14, 21, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 20px; box-sizing: border-box; }
        .modal h1 { color: #ec4899; font-size: 36px; margin-bottom: 10px; }
        .modal p { font-size: 20px; margin-bottom: 20px; color: #cbd5e1; }
        .btn { background: #4f46e5; color: white; border: none; padding: 12px 30px; font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; transition: 0.3s; font-family: 'Cairo'; }
        .btn:hover { background: #4338ca; transform: translateY(-2px); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- شاشة المعلومات العلوية HUD -->
        <div class="hud">
            <div>اللاعب: <span id="playerName">بطل</span></div>
            <div>⏱️ الوقت: <span id="timeLeft">90</span>ث</div>
            <div>🔥 السلسلة: <span id="streakCount">0</span></div>
            <div>⭐ النقاط: <span id="scoreVal">0</span></div>
        </div>

        <!-- ساحة اللعب -->
        <div class="arena">
            <div class="question-box" id="questionDisplay">? × ?</div>
            <div class="rocket" id="rocketIcon">🚀</div>
            <div style="margin: 10px 0; font-size: 15px; color: #94a3b8;">اختر الناتج الصحيح للكويكب المناسب!</div>
            <div class="asteroid-container" id="asteroidOptions">
                <!-- سيتم توليد الأزرار هنا برمجياً بضمان الظهور -->
            </div>
        </div>

        <!-- شاشة النهاية والنتيجة -->
        <div class="modal hidden" id="gameOverModal">
            <h1>انتهى السباق! 🏆</h1>
            <p id="finalScoreText">لقد جمعت 0 نقطة</p>
            <p id="saveStatus" style="color: #38bdf8; font-size: 16px;"></p>
            <div style="display: flex; gap: 15px;">
                <button class="btn" onclick="restartGame()">إعادة اللعب 🔄</button>
                <button class="btn" style="background: #059669;" onclick="goToMain()">الرئيسية 🏠</button>
            </div>
        </div>
    </div>

    <script>
        // قراءة بيانات الطالب من الجلسة مع وضع قيمة افتراضية للتجربة المباشرة
        let studentData = JSON.parse(localStorage.getItem('current_student')) || { name: "أحمد (تجريبي)", cls: "5ب4" };
        document.getElementById('playerName').textContent = studentData.name;

        let customSettings = JSON.parse(localStorage.getItem('rocket_game_settings')) || {
            gameTime: 90,
            correctPoints: 100,
            wrongPenalty: 30,
            streakCount: 5,
            bonusTime: 30
        };

        let score = 0;
        let timeLeft = customSettings.gameTime;
        let streak = 0;
        let timerInterval = null;
        let currentCorrectAnswer = 0;
        let maxTable = 10;

        function initGameSettings() {
            const cls = String(studentData.cls || '').trim();
            if (cls.includes('4') || cls.startsWith('4')) {
                maxTable = 6;
            } else if (cls.includes('5') || cls.startsWith('5') || cls.includes('6')) {
                maxTable = 12;
            } else {
                maxTable = 10;
            }
            startGameEngine();
        }

        function startGameEngine() {
            score = 0;
            timeLeft = customSettings.gameTime;
            streak = 0;
            updateHUD();
            document.getElementById('gameOverModal').classList.add('hidden');
            generateNewQuestion();

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                updateHUD();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endGame();
                }
            }, 1000);
        }

        function updateHUD() {
            document.getElementById('scoreVal').textContent = score;
            document.getElementById('timeLeft').textContent = timeLeft;
            document.getElementById('streakCount').textContent = streak;
        }

        function generateNewQuestion() {
            let num1 = Math.floor(Math.random() * (maxTable - 1)) + 2;
            let num2 = Math.floor(Math.random() * 10) + 1;
            currentCorrectAnswer = num1 * num2;

            const qDisplay = document.getElementById('questionDisplay');
            if(qDisplay) {
                qDisplay.textContent = `${num1} × ${num2}`;
            }

            let options = [currentCorrectAnswer];
            while (options.length < 3) {
                let wrong = currentCorrectAnswer + (Math.floor(Math.random() * 11) - 5);
                if (wrong > 0 && !options.includes(wrong)) {
                    options.push(wrong);
                }
            }
            options.sort(() => Math.random() - 0.5);

            let container = document.getElementById('asteroidOptions');
            if(container) {
                container.innerHTML = '';
                options.forEach(opt => {
                    let btn = document.createElement('div');
                    btn.className = 'asteroid';
                    btn.textContent = opt;
                    btn.onclick = () => checkAnswer(opt);
                    container.appendChild(btn);
                });
            }
        }

        function checkAnswer(selectedOpt) {
            let rocket = document.getElementById('rocketIcon');
            if (selectedOpt === currentCorrectAnswer) {
                score += customSettings.correctPoints + (streak * 10);
                streak++;
                if(rocket) {
                    rocket.style.transform = "scale(1.2) translateY(-10px)";
                    setTimeout(() => rocket.style.transform = "scale(1)", 200);
                }

                if (streak > 0 && streak % customSettings.streakCount === 0) {
                    timeLeft += customSettings.bonusTime;
                    alert(`🔥 أداء ممتاز! حصلت على +${customSettings.bonusTime} ثوانٍ إضافية.`);
                }
            } else {
                score = Math.max(0, score - customSettings.wrongPenalty);
                streak = 0;
                if(rocket) {
                    rocket.style.transform = "rotate(10deg)";
                    setTimeout(() => rocket.style.transform = "rotate(0deg)", 200);
                }
            }
            updateHUD();
            generateNewQuestion();
        }

        async function endGame() {
            document.getElementById('gameOverModal').classList.remove('hidden');
            document.getElementById('finalScoreText').textContent = `أحسنت يا ${studentData.name}! لقد جمعت ${score} نقطة.`;
            document.getElementById('saveStatus').textContent = 'جاري حفظ النتيجة في سحابة مدرسة اليرموك...';

            try {
                const { error } = await supabaseClient.from('scores').insert([{
                    student_name: studentData.name,
                    student_class: studentData.cls,
                    grade: studentData.cls,
                    game_name: 'سباق صواريخ الفضاء',
                    score: score
                }]);

                if (error) throw error;
                document.getElementById('saveStatus').textContent = '✅ تم حفظ النتيجة بنجاح في السحابة!';
            } catch (err) {
                console.error("Save Score Error:", err);
                document.getElementById('saveStatus').textContent = '⚠️ حدث خطأ أثناء الحفظ بالسحابة.';
            }
        }

        function restartGame() {
            startGameEngine();
        }

        function goToMain() {
            window.location.href = 'student.html';
        }

        window.onload = function() {
            initGameSettings();
        };
    </script>
</body>
</html>
