<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سباق صواريخ الفضاء - ملك جدول الضرب</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: radial-gradient(circle, #1a1c29 0%, #0d0e15 100%); color: white; margin: 0; padding: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .game-container { width: 100%; max-width: 600px; height: 100vh; background: rgba(15, 23, 42, 0.85); position: relative; box-shadow: 0 0 30px rgba(79, 70, 229, 0.4); display: flex; flex-direction: column; justify-content: space-between; border-left: 2px solid #334155; border-right: 2px solid #334155; }
        .hud { display: flex; justify-content: space-between; padding: 15px 20px; background: rgba(30, 41, 59, 0.9); font-size: 18px; font-weight: bold; border-bottom: 2px solid #4f46e5; z-index: 10; }
        .hud span { color: #f59e0b; }
        .arena { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 30px; }
        .question-box { background: rgba(79, 70, 229, 0.9); padding: 15px 35px; border-radius: 15px; font-size: 36px; font-weight: 900; margin-bottom: 30px; box-shadow: 0 0 25px rgba(79, 70, 229, 0.8); letter-spacing: 2px; }
        .asteroid-container { display: flex; gap: 15px; justify-content: center; width: 100%; padding: 0 20px; box-sizing: border-box; }
        .asteroid { background: linear-gradient(135deg, #475569, #1e293b); border: 2px solid #64748b; color: white; padding: 20px; border-radius: 50%; width: 75px; height: 75px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); user-select: none; }
        .asteroid:hover { transform: scale(1.1); background: linear-gradient(135deg, #64748b, #334155); border-color: #f59e0b; }
        .rocket { font-size: 55px; margin-top: 15px; transition: transform 0.2s; user-select: none; }
        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(13, 14, 21, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 20px; box-sizing: border-box; }
        .modal h1 { color: #ec4899; font-size: 36px; margin-bottom: 10px; }
        .modal p { font-size: 20px; margin-bottom: 20px; color: #cbd5e1; }
        .btn { background: #4f46e5; color: white; border: none; padding: 12px 30px; font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; transition: 0.3s; font-family: 'Cairo'; }
        .btn:hover { background: #4338ca; transform: translateY(-2px); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- شاشة المعلومات العلوية HUD -->
        <div class="hud">
            <div>اللاعب: <span id="playerName">بطل</span></div>
            <div>⏱️ الوقت: <span id="timeLeft">90</span>ث</div>
            <div>🔥 السلسلة: <span id="streakCount">0</span></div>
            <div>⭐ النقاط: <span id="scoreVal">0</span></div>
        </div>

        <!-- ساحة اللعب -->
        <div class="arena">
            <div class="question-box" id="questionDisplay">? × ?</div>
            <div class="rocket" id="rocketIcon">🚀</div>
            <div style="margin: 15px 0; font-size: 14px; color: #94a3b8;">اختر الناتج الصحيح للكويكب المناسب!</div>
            <div class="asteroid-container" id="asteroidOptions">
                <!-- يتم توليد الخيارات برمجياً -->
            </div>
        </div>

        <!-- شاشة النهاية والنتيجة -->
        <div class="modal hidden" id="gameOverModal">
            <h1>انتهى السباق! 🏆</h1>
            <p id="finalScoreText">لقد جمعت 0 نقطة</p>
            <p id="saveStatus" style="color: #38bdf8; font-size: 1
