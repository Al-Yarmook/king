<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختر اللعبة والتحدي - ملك جدول الضرب</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: radial-gradient(circle, #1e1b4b 0%, #0f172a 100%); color: white; margin: 0; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; }
        .main-card { background: rgba(30, 41, 59, 0.95); padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 500px; text-align: center; border: 2px solid #4f46e5; }
        
        h2 { color: #f59e0b; margin-bottom: 10px; font-size: 26px; }
        .welcome-user { background: rgba(79, 70, 229, 0.2); border: 1px solid #4f46e5; padding: 10px; border-radius: 10px; font-size: 16px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
        .welcome-user span { color: #38bdf8; font-weight: bold; }
        
        .games-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 20px; }
        .game-card { background: linear-gradient(135deg, #312e81, #1e1b4b); border: 2px solid #6366f1; border-radius: 14px; padding: 20px; text-align: right; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .game-card:hover { transform: translateY(-3px); border-color: #f59e0b; background: linear-gradient(135deg, #3730a3, #312e81); }
        .game-info h3 { margin: 0 0 5px 0; color: #fef08a; font-size: 20px; }
        .game-info p { margin: 0; font-size: 13px; color: #94a3b8; }
        .game-icon { font-size: 40px; }

        .btn-secondary { background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: 'Cairo'; font-size: 13px; transition: 0.2s; }
        .btn-secondary:hover { background: #dc2626; }
        
        /* قسم تسجيل النطاق لو لم يتم اختيار اسم بعد */
        .selection-section { display: none; }
        label { display: block; margin-bottom: 8px; font-weight: 600; text-align: right; color: #cbd5e1; }
        select, .btn-primary { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #4f46e5; border-radius: 8px; font-family: 'Cairo'; box-sizing: border-box; }
        select { background: #0f172a; color: white; }
        .btn-primary { background: #4f46e5; color: white; border: none; font-weight: bold; cursor: pointer; font-size: 18px; transition: 0.3s; }
        .btn-primary:hover { background: #4338ca; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="main-card">
        <!-- قسم اختيار الاسم والصف (يظهر إذا لم يتم تسجيل الطالب) -->
        <div id="loginSection" class="selection-section">
            <h2>اختر صفك واسمك للبدء 🎮</h2>
            
            <label>اختر الصف الدراسي:</label>
            <select id="classSelect" onchange="loadStudentsByClass()">
                <option value="">-- اختر الصف --</option>
            </select>

            <label>اختر اسم الطالب:</label>
            <select id="studentSelect">
                <option value="">-- اختر اسمك --</option>
            </select>

            <button class="btn-primary" onclick="saveStudentAndEnter()">ابدأ التحدي 🚀</button>
        </div>

        <!-- قسم اختيار اللعبة (يظهر عندما يكون الطالب مسجلاً ومغيوثاً) -->
        <div id="hubSection" class="selection-section hidden">
            <h2>مرحباً بك يا بطل! 🌟</h2>
            <div class="welcome-user">
                <div>البطل: <span id="displayStudentName">--</span> (<span id="displayStudentClass">--</span>)</div>
                <button class="btn-secondary" onclick="changeStudent()">🔄 تغيير اللاعب</button>
            </div>

            <p style="text-align: right; color: #94a3b8; font-size: 14px; margin-bottom: 15px;">اختر لعبتك المفضلة وابدأ المنافسة:</p>

            <div class="games-grid">
                <a href="rocket.html" class="game-card">
                    <div class="game-info">
                        <h3>🚀 سباق صواريخ الفضاء</h3>
                        <p>دمر الكويكبات الفضائية بأشعة الليزر عبر حل جدول الضرب بسرعة!</p>
                    </div>
                    <div class="game-icon">🚀</div>
                </a>

                <a href="goldmine.html" class="game-card">
                    <div class="game-info">
                        <h3>⛏️ لغز منجم الذهب</h3>
                        <p>استكشف المغارات وافتح الأبواب الحجرية لجمع صندوق الذهب والكنوز!</p>
                    </div>
                    <div class="game-icon">🪙</div>
                </a>
            </div>
        </div>
    </div>

    <script>
        let allStudents = [];

        document.addEventListener('DOMContentLoaded', async () => {
            checkCurrentStudent();
            await fetchStudents();
        });

        function checkCurrentStudent() {
            let studentData = null;
            try {
                studentData = JSON.parse(localStorage.getItem('current_student'));
            } catch (e) {
                studentData = null;
            }

            if (studentData && studentData.name && studentData.cls) {
                document.getElementById('displayStudentName').textContent = studentData.name;
                document.getElementById('displayStudentClass').textContent = studentData.cls;
                document.getElementById('hubSection').classList.remove('hidden');
                document.getElementById('loginSection').classList.add('hidden');
            } else {
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('hubSection').classList.add('hidden');
            }
        }

        async function fetchStudents() {
            const { data, error } = await supabaseClient.from('students').select('*');
            if(error) {
                console.error("Error fetching students:", error);
                alert('حدث خطأ أثناء تحميل بيانات الطلاب.');
                return;
            }

            if(data && data.length > 0) {
                allStudents = data;
                let classes = [...new Set(data.map(s => s.cls))].filter(Boolean);
                const classSelect = document.getElementById('classSelect');
                classSelect.innerHTML = '<option value="">-- اختر الصف --</option>';
                
                classes.forEach(cls => {
                    classSelect.innerHTML += `<option value="${cls}">${cls}</option>`;
                });
            }
        }

        function loadStudentsByClass() {
            const selectedClass = document.getElementById('classSelect').value;
            const studentSelect = document.getElementById('studentSelect');
            studentSelect.innerHTML = '<option value="">-- اختر اسمك --</option>';

            if(!selectedClass) return;

            const filtered = allStudents.filter(s => s.cls === selectedClass);
            filtered.forEach(s => {
                studentSelect.innerHTML += `<option value="${s.name}">${s.name}</option>`;
            });
        }

        function saveStudentAndEnter() {
            const cls = document.getElementById('classSelect').value;
            const name = document.getElementById('studentSelect').value;

            if(!cls || !name) {
                alert('الرجاء اختيار الصف واسم الطالب أولاً!');
                return;
            }

            localStorage.setItem('current_student', JSON.stringify({ name, cls }));
            checkCurrentStudent();
        }

        function changeStudent() {
            localStorage.removeItem('current_student');
            checkCurrentStudent();
        }
    </script>
</body>
</html>
