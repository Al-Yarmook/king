<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختر اسمك - ملك جدول الضرب</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #d81b60; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; text-align: right; color: #333; }
        select, button { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; font-family: 'Cairo'; box-sizing: border-box; }
        select { background: white; }
        .btn { background: #d81b60; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #ad1457; }
    </style>
</head>
<body>

    <div class="card">
        <h2>اختر صفك واسمك للبدء 🎮</h2>
        
        <label>اختر الصف الدراسي:</label>
        <select id="classSelect" onchange="loadStudentsByClass()">
            <option value="">-- اختر الصف --</option>
        </select>

        <label>اختر اسم الطالب:</label>
        <select id="studentSelect">
            <option value="">-- اختر اسمك --</option>
        </select>

        <button class="btn" onclick="startGame()">ابدأ التحدي 🚀</button>
    </div>

    <script>
        let allStudents = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await fetchStudents();
        });

        async function fetchStudents() {
            const { data, error } = await supabaseClient.from('students').select('*');
            if(error) {
                console.error("Error fetching students:", error);
                alert('حدث خطأ أثناء تحميل بيانات الطلاب.');
                return;
            }

            if(data && data.length > 0) {
                allStudents = data;
                let classes = [...new Set(data.map(s => s.cls))].filter(Boolean);
                const classSelect = document.getElementById('classSelect');
                classSelect.innerHTML = '<option value="">-- اختر الصف --</option>';
                
                classes.forEach(cls => {
                    classSelect.innerHTML += `<option value="${cls}">${cls}</option>`;
                });
            }
        }

        function loadStudentsByClass() {
            const selectedClass = document.getElementById('classSelect').value;
            const studentSelect = document.getElementById('studentSelect');
            studentSelect.innerHTML = '<option value="">-- اختر اسمك --</option>';

            if(!selectedClass) return;

            const filtered = allStudents.filter(s => s.cls === selectedClass);
            filtered.forEach(s => {
                studentSelect.innerHTML += `<option value="${s.name}">${s.name}</option>`;
            });
        }

        function startGame() {
            const cls = document.getElementById('classSelect').value;
            const name = document.getElementById('studentSelect').value;

            if(!cls || !name) {
                alert('الرجاء اختيار الصف واسم الطالب أولاً!');
                return;
            }

            localStorage.setItem('current_student', JSON.stringify({ name, cls }));
            window.location.href = 'rocket.html';
        }
    </script>
</body>
</html>
