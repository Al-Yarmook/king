<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الطالب - منصة ملك جدول الضرب</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #d81b60;
            --primary-hover: #ad1457;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; position: relative; }
        
        .login-card { background: var(--card-bg); padding: 35px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 420px; text-align: center; border-top: 5px solid var(--primary); margin-bottom: 30px; }
        h1 { color: var(--primary); font-size: 24px; font-weight: 900; margin-bottom: 10px; }
        p { color: #64748b; font-size: 14px; margin-bottom: 20px; }

        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: var(--text); font-size: 14px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: 'Cairo'; font-size: 14px; background: #fff; }
        select:focus, input:focus { border-color: var(--primary); outline: none; }

        .btn { background: var(--primary); color: white; border: none; padding: 12px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; font-family: 'Cairo'; margin-top: 10px; text-decoration: none; display: inline-block; }
        .btn:hover { background: var(--primary-hover); }
        .btn-dark { background: #334155; margin-top: 10px; }
        .btn-dark:hover { background: #1e293b; }

        footer.author-footer {
            position: absolute;
            bottom: 10px;
            text-align: center;
            width: 100%;
            font-size: 13px;
            color: #64748b;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>🌟 بوابة الطالب البطل</h1>
        <p>اختر صفك ثم اختر اسمك لتبدأ المغامرة والتحدي!</p>

        <div class="form-group">
            <label>اختر صفك الدراسي:</label>
            <select id="classSelect" onchange="loadStudentsByClass()">
                <option value="">-- اختر الصف الدراسي --</option>
            </select>
        </div>

        <div class="form-group">
            <label>اختر اسم الطالب:</label>
            <select id="studentSelect">
                <option value="">-- اختر اسمك من القائمة --</option>
            </select>
        </div>

        <button class="btn" onclick="saveStudentAndProceed()">دخول المنصة 🚀</button>
        <a href="index.html" class="btn btn-dark">الرئيسية 🏠</a>
    </div>

    <footer class="author-footer">
        إعداد أ. صادق القلعاوي | مدرسة اليرموك الابتدائية للبنين 🏫✨
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadClassesDropdown();
        });

        async function loadClassesDropdown() {
            try {
                const { data, error } = await supabaseClient.from('students').select('cls');
                if (error) throw error;

                const classesSet = new Set();
                data.forEach(item => { if (item.cls) classesSet.add(item.cls.trim()); });

                const classSelect = document.getElementById('classSelect');
                classSelect.innerHTML = '<option value="">-- اختر الصف الدراسي --</option>';
                Array.from(classesSet).sort().forEach(clsName => {
                    classSelect.innerHTML += `<option value="${clsName}">${clsName}</option>`;
                });
            } catch (err) {
                console.error("Error loading classes:", err);
            }
        }

        async function loadStudentsByClass() {
            const selectedClass = document.getElementById('classSelect').value;
            const studentSelect = document.getElementById('studentSelect');
            studentSelect.innerHTML = '<option value="">-- جاري تحميل الأسماء... --</option>';

            if (!selectedClass) {
                studentSelect.innerHTML = '<option value="">-- اختر صفك أولاً --</option>';
                return;
            }

            try {
                const { data, error } = await supabaseClient.from('students').select('*').eq('cls', selectedClass).order('name', { ascending: true });
                if (error) throw error;

                studentSelect.innerHTML = '<option value="">-- اختر اسمك من القائمة --</option>';
                if (data && data.length > 0) {
                    data.forEach(st => {
                        studentSelect.innerHTML += `<option value="${st.name}">${st.name}</option>`;
                    });
                } else {
                    studentSelect.innerHTML = '<option value="">-- لا توجد أسماء مسجلة لهذا الصف --</option>';
                }
            } catch (err) {
                console.error("Error loading students:", err);
                studentSelect.innerHTML = '<option value="">-- خطأ في تحميل الأسماء --</option>';
            }
        }

        function saveStudentAndProceed() {
            const cls = document.getElementById('classSelect').value;
            const name = document.getElementById('studentSelect').value;

            if (!cls || !name) {
                alert('الرجاء اختيار الصف واسم الطالب للمتابعة!');
                return;
            }

            const studentInfo = { name: name, cls: cls };
            localStorage.setItem('current_student', JSON.stringify(studentInfo));
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
