<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة المعلمين والإدارة - ملك جدول الضرب</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js?v=2.5"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f0fdf4; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 35px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; border-top: 5px solid #16a34a; }
        h1 { color: #16a34a; font-size: 24px; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; text-align: right; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #334155; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 10px; box-sizing: border-box; font-family: 'Cairo'; font-size: 15px; }
        input:focus { border-color: #16a34a; outline: none; }
        .btn { background: #16a34a; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; font-family: 'Cairo'; margin-top: 10px; }
        .btn:hover { background: #15803d; }
        .back-link { display: inline-block; margin-top: 20px; color: #475569; text-decoration: none; font-size: 14px; font-weight: bold; }
        footer.author-footer { position: absolute; bottom: 10px; text-align: center; width: 100%; font-size: 13px; color: #64748b; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>👨‍🏫 بوابة المعلمين والإدارة</h1>
        <div class="form-group">
            <label>الرقم الشخصي أو اسم المستخدم:</label>
            <input type="text" id="staffIdentifier" placeholder="أدخل الرقم أو Admin">
        </div>
        <div class="form-group">
            <label>كلمة المرور:</label>
            <input type="password" id="staffPassword" placeholder="أدخل كلمة المرور">
        </div>
        <button class="btn" onclick="loginStaff()">تسجيل الدخول 🚀</button>
        <br>
        <a href="index.html" class="back-link">← العودة للرئيسية</a>
    </div>

    <footer class="author-footer">
        إعداد أ. صادق القلعاوي | مدرسة اليرموك الابتدائية للبنين 🏫✨
    </footer>

    <script>
        async function loginStaff() {
            const inputVal = document.getElementById('staffIdentifier').value.trim();
            const passwordVal = document.getElementById('staffPassword').value.trim();

            if (!inputVal || !passwordVal) {
                alert('الرجاء إدخال بيانات الدخول كاملةً!');
                return;
            }

            try {
                // جلب كافة المعلمين والمدراء من السحابة للتحقق بمرونة تامة بغض النظر عن حالة الأحرف
                const { data, error } = await supabaseClient.from('staff').select('*');

                if (error || !data || data.length === 0) {
                    alert('⚠️ جدول المعلمين فارغ أو حدث خطأ في الاتصال بالسحابة.');
                    return;
                }

                // البحث عن الحساب المطابق (سواء بالرقم الشخصي، البريد، أو الدور Admin)
                const matchedUser = data.find(user => {
                    const cprMatch = String(user.cpr || '').trim().toLowerCase() === inputVal.toLowerCase();
                    const emailMatch = String(user.email || '').trim().toLowerCase() === inputVal.toLowerCase();
                    const roleMatch = String(user.role || '').trim().toLowerCase() === inputVal.toLowerCase();
                    const nameMatch = String(user.name || '').trim().toLowerCase() === inputVal.toLowerCase();
                    
                    return (cprMatch || emailMatch || roleMatch || nameMatch);
                });

                if (!matchedUser) {
                    alert('⚠️ اسم المستخدم أو الرقم غير موجود في النظام.');
                    return;
                }

                // مطابقة كلمة المرور
                if (String(matchedUser.password).trim() === passwordVal) {
                    localStorage.setItem('current_staff_user', JSON.stringify(matchedUser));
                    alert(`أهلاً بك يا ${matchedUser.name || 'أستاذ'}! جاري تحويلك للوحة التحكم...`);
                    window.location.href = 'dashboard.html';
                } else {
                    alert('❌ كلمة المرور غير صحيحة!');
                }
            } catch (err) {
                console.error("Login Error:", err);
                alert('حدث خطأ فني أثناء الاتصال بالسحابة.');
            }
        }
    </script>
</body>
</html>
