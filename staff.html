<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة المعلمين والإدارة - ملك جدول الضرب</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f4f7f6; margin: 0; padding: 0; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-card { background: white; padding: 35px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; box-sizing: border-box; }
        h2 { color: #d81b60; margin-bottom: 25px; font-size: 24px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; text-align: right; color: #333; font-size: 14px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 8px; font-family: 'Cairo'; box-sizing: border-box; font-size: 15px; }
        input:focus { border-color: #d81b60; outline: none; box-shadow: 0 0 5px rgba(216,27,96,0.2); }
        .btn { background: #d81b60; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; padding: 12px; border-radius: 8px; font-size: 16px; font-family: 'Cairo'; }
        .btn:hover { background: #ad1457; }
        .back-link { display: block; margin-top: 15px; color: #666; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #d81b60; }
        .footer-note { margin-top: 20px; font-size: 12px; color: #888; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>👨‍🏫 بوابة المعلمين والإدارة</h2>
        
        <label>الرقم الشخصي أو اسم المستخدم:</label>
        <input type="text" id="userInput" placeholder="مثال: Admin أو الرقم الشخصي">

        <label>كلمة المرور:</label>
        <input type="password" id="passInput" placeholder="أدخل كلمة المرور">

        <button class="btn" onclick="handleStaffLogin()">تسجيل الدخول 🔓</button>

        <a href="index.html" class="back-link">← العودة للرئيسية</a>

        <div class="footer-note">
            إعداد أ. صادق القلعاوي | مدرسة اليرموك الابتدائية للبنين 🏫✨
        </div>
    </div>

    <script>
        async function handleStaffLogin() {
            const rawInput = document.getElementById('userInput').value.trim();
            const password = document.getElementById('passInput').value.trim();

            if (!rawInput || !password) {
                alert('الرجاء إدخال اسم المستخدم/الرقم الشخصي وكلمة المرور!');
                return;
            }

            try {
                // جلب جميع الحسابات من جدول المعلمين والإدارة لتحقيق مرونة تامة بغض النظر عن حالة الأحرف
                const { data, error } = await supabaseClient
                    .from('staff')
                    .select('*');

                if (error) {
                    throw error;
                }

                if (!data || data.length === 0) {
                    alert('⚠️ لا توجد حسابات مسجلة في جدول المعلمين.');
                    return;
                }

                // البحث عن الحساب بمطابقة مرنة تتجاهل حالة الأحرف (Case-insensitive)
                const matchedUser = data.find(st => {
                    const dbUser = String(st.username || '').trim().toLowerCase();
                    const dbCpr = String(st.cpr || '').trim();
                    const inputLower = rawInput.toLowerCase();

                    return (dbUser === inputLower || dbCpr === rawInput);
                });

                if (!matchedUser) {
                    alert('⚠️ اسم المستخدم أو الرقم غير موجود في النظام.');
                    return;
                }

                // التحقق من كلمة المرور
                const dbPass = String(matchedUser.password || '').trim();
                if (dbPass === password) {
                    // تخزين بيانات المستخدم في الذاكرة المحلية والانتقال للوحة التحكم
                    localStorage.setItem('current_staff_user', JSON.stringify(matchedUser));
                    window.location.href = 'dashboard.html';
                } else {
                    alert('❌ كلمة المرور غير صحيحة!');
                }

            } catch (err) {
                console.error("Login Error:", err);
                alert('حدث خطأ أثناء الاتصال بالسحابة: ' + err.message);
            }
        }

        // دعم الضغط على زر Enter لتسجيل الدخول مباشرة
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleStaffLogin();
            }
        });
    </script>
</body>
