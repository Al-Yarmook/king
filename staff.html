<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة المعلمين والإدارة - ملك جدول الضرب</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #d81b60;
            --primary-hover: #ad1457;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; position: relative; }
        
        .login-card { background: var(--card-bg); padding: 35px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; margin-bottom: 30px; }
        h2 { color: var(--primary); margin-bottom: 25px; font-size: 24px; font-weight: 900; }

        .form-group { margin-bottom: 20px; text-align: right; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; font-size: 14px; }
        
        .input-container { position: relative; display: flex; align-items: center; }
        input { width: 100%; padding: 12px; padding-left: 45px; border: 1px solid #ccc; border-radius: 8px; font-family: 'Cairo'; font-size: 15px; background: #fff; }
        input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 5px rgba(216,27,96,0.2); }

        /* زر معاينة كلمة المرور */
        .toggle-password { position: absolute; left: 12px; background: none; border: none; cursor: pointer; font-size: 18px; color: #64748b; }

        .btn { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; padding: 12px; border-radius: 8px; font-size: 16px; font-family: 'Cairo'; margin-top: 5px; }
        .btn:hover { background: var(--primary-hover); }
        
        /* زر العودة للرئيسية المنسق */
        .btn-dark { background: #334155; margin-top: 12px; text-decoration: none; display: inline-block; color: white; text-align: center; }
        .btn-dark:hover { background: #1e293b; }

        .footer-note { margin-top: 20px; font-size: 12px; color: #888; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>👨‍🏫 بوابة المعلمين والإدارة</h2>
        
        <div class="form-group">
            <label>الرقم الشخصي أو اسم المستخدم:</label>
            <input type="text" id="userInput" placeholder="مثال: Admin أو الرقم الشخصي">
        </div>

        <div class="form-group">
            <label>كلمة المرور:</label>
            <div class="input-container">
                <input type="password" id="passInput" placeholder="أدخل كلمة المرور">
                <button type="button" class="toggle-password" id="togglePasswordBtn" onclick="togglePasswordVisibility()">👁️</button>
            </div>
        </div>

        <button class="btn" onclick="handleStaffLogin()">تسجيل الدخول 🔓</button>

        <a href="index.html" class="btn btn-dark">🏠 الرئيسية</a>

        <div class="footer-note">
            إعداد أ. صادق القلعاوي | مدرسة اليرموك الابتدائية للبنين 🏫✨
        </div>
    </div>

    <script>
        // معاينة كلمة المرور
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('passInput');
            const toggleBtn = document.getElementById('togglePasswordBtn');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = '👁️‍🗨️';
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = '👁️';
            }
        }

        async function handleStaffLogin() {
            const rawInput = document.getElementById('userInput').value.trim();
            const password = document.getElementById('passInput').value.trim();

            if (!rawInput || !password) {
                alert('الرجاء إدخال اسم المستخدم/الرقم الشخصي وكلمة المرور!');
                return;
            }

            // التحقق المباشر لحساب المدير العام الأساسي لضمان الدخول الفوري دون عوائق
            if (rawInput.toLowerCase() === 'admin' && password === '123456') {
                localStorage.setItem('is_admin', 'true');
                localStorage.setItem('current_staff_user', JSON.stringify({ name: 'مدير النظام', username: 'Admin' }));
                window.location.href = 'dashboard.html';
                return;
            }

            try {
                // البحث في جدول المعلمين والإدارة في السحابة
                const { data, error } = await supabaseClient
                    .from('staff')
                    .select('*');

                if (error) throw error;

                if (!data || data.length === 0) {
                    alert('⚠️ لا توجد حسابات مسجلة في جدول المعلمين.');
                    return;
                }

                const matchedUser = data.find(st => {
                    const dbUser = String(st.username || '').trim().toLowerCase();
                    const dbCpr = String(st.cpr || '').trim();
                    const inputLower = rawInput.toLowerCase();
                    return (dbUser === inputLower || dbCpr === rawInput);
                });

                if (!matchedUser) {
                    alert('⚠️ اسم المستخدم أو الرقم غير موجود في النظام.');
                    return;
                }

                const dbPass = String(matchedUser.password || '').trim();
                if (dbPass === password) {
                    localStorage.setItem('current_staff_user', JSON.stringify(matchedUser));
                    window.location.href = 'dashboard.html';
                } else {
                    alert('❌ كلمة المرور غير صحيحة!');
                }

            } catch (err) {
                console.error("Login Error:", err);
                alert('حدث خطأ أثناء الاتصال بالسحابة: ' + err.message);
            }
        }

        // دعم الضغط على زر Enter لتسجيل الدخول مباشرة
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleStaffLogin();
            }
        });
    </script>
</body>
</html>
