<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة المعلمين والإدارة - منصة ملك جدول الضرب</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f0fdf4; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 35px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; border-top: 5px solid #16a34a; }
        h1 { color: #16a34a; font-size: 24px; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; text-align: right; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #334155; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 10px; box-sizing: border-box; font-family: 'Cairo'; font-size: 15px; transition: 0.3s; }
        input:focus { border-color: #16a34a; outline: none; box-shadow: 0 0 8px rgba(22, 163, 74, 0.2); }
        .btn { background: #16a34a; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; transition: 0.3s; font-family: 'Cairo'; margin-top: 10px; }
        .btn:hover { background: #15803d; }
        .back-link { display: inline-block; margin-top: 20px; color: #475569; text-decoration: none; font-size: 14px; font-weight: bold; }
        .back-link:hover { color: #16a34a; }
        
        footer.author-footer {
            position: absolute;
            bottom: 10px;
            text-align: center;
            width: 100%;
            font-size: 13px;
            color: #64748b;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>👨‍🏫 بوابة المعلمين والإدارة</h1>
        <div class="form-group">
            <label>الرقم الشخصي أو البريد الإلكتروني:</label>
            <input type="text" id="staffIdentifier" placeholder="أدخل رقمك الشخصي">
        </div>
        <div class="form-group">
            <label>كلمة المرور:</label>
            <input type="password" id="staffPassword" placeholder="أدخل كلمة المرور">
        </div>
        <button class="btn" onclick="loginStaff()">تسجيل الدخول 🚀</button>
        <br>
        <a href="index.html" class="back-link">← العودة للرئيسية</a>
    </div>

    <footer class="author-footer">
        إعداد أ. صادق القلعاوي | مدرسة اليرموك الابتدائية للبنين 🏫✨
    </footer>

    <script>
        async function loginStaff() {
            const identifier = document.getElementById('staffIdentifier').value.trim();
            const password = document.getElementById('staffPassword').value.trim();

            if (!identifier || !password) {
                alert('الرجاء إدخال بيانات الدخول كاملةً!');
                return;
            }

            try {
                // البحث في جدول المعلمين staff حسب الرقم الشخصي أو البريد
                const { data, error } = await supabaseClient
                    .from('staff')
                    .select('*')
                    .or(`cpr.eq.${identifier},email.eq.${identifier}`)
                    .single();

                if (error || !data) {
                    alert('⚠️ اسم المستخدم غير موجود أو خطأ في البيانات.');
                    return;
                }

                if (data.password === password) {
                    localStorage.setItem('current_staff_user', JSON.stringify(data));
                    alert(`أهلاً بك يا ${data.name || 'أستاذ'}! جاري تحويلك للوحة التحكم...`);
                    window.location.href = 'dashboard.html';
                } else {
                    alert('❌ كلمة المرور غير صحيحة!');
                }
            } catch (err) {
                console.error("Login Error:", err);
                alert('حدث خطأ أثناء الاتصال بالسحابة.');
            }
        }
    </script>
</body>
</html>
