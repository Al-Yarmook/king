<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول المعلمين والإدارة - ملك جدول الضرب</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #f3e7e9 0%, #e3eeff 99%, #e3eeff 100%); margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        h2 { color: #d81b60; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; text-align: right; }
        label { display: block; margin-bottom: 8px; color: #d81b60; font-weight: 600; }
        .input-container { position: relative; }
        input { width: 100%; padding: 12px 45px 12px 15px; border: 2px solid #ffccd5; border-radius: 10px; font-size: 16px; font-family: 'Cairo', sans-serif; box-sizing: border-box; outline: none; transition: 0.3s; }
        input:focus { border-color: #d81b60; }
        .toggle-password { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 18px; user-select: none; }
        .btn { background: #d81b60; color: white; border: none; width: 100%; padding: 12px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn:hover { background: #ad1457; }
        .back-link { display: block; margin-top: 20px; color: #3f51b5; text-decoration: none; font-weight: 600; cursor: pointer; }
        .back-link:hover { text-decoration: underline; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- نموذج تسجيل الدخول -->
    <div class="card" id="loginCard">
        <h2>تسجيل دخول المعلمين والإدارة</h2>
        <div class="form-group">
            <label>البريد الإلكتروني أو اسم المستخدم / الرقم الشخصي:</label>
            <input type="text" id="staffEmail" placeholder="أدخل اسم المستخدم أو الرقم">
        </div>
        <div class="form-group">
            <label>كلمة المرور:</label>
            <div class="input-container">
                <input type="password" id="staffPass" placeholder="أدخل كلمة المرور">
                <span class="toggle-password" id="toggleStaffPass">👁️</span>
            </div>
        </div>
        <button class="btn" id="loginBtn">دخول للنظام 🔐</button>
        <a class="back-link" onclick="showForgotCard()">نسيت كلمة المرور؟ 🤔</a>
        <a href="index.html" class="back-link">← العودة للرئيسية</a>
    </div>

    <!-- نموذج تغيير كلمة المرور عند الدخول لأول مرة (0) -->
    <div class="card hidden" id="resetCard">
        <h2>🔒 تعيين كلمة مرور جديدة</h2>
        <p style="color: #666; margin-bottom: 20px; font-size: 14px;">هذه هي مرتك الأولى للنظام، يرجى تعيين كلمة مرور جديدة ومؤمنة.</p>
        <div class="form-group">
            <label>كلمة المرور الجديدة:</label>
            <div class="input-container">
                <input type="password" id="newPass" placeholder="أدخل كلمة المرور الجديدة">
                <span class="toggle-password" id="toggleNewPass">👁️</span>
            </div>
        </div>
        <div class="form-group">
            <label>تأكيد كلمة المرور:</label>
            <div class="input-container">
                <input type="password" id="confirmPass" placeholder="أعد إدخال كلمة المرور">
                <span class="toggle-password" id="toggleConfirmPass">👁️</span>
            </div>
        </div>
        <button class="btn" id="updatePassBtn">حفظ ودخول 🚀</button>
    </div>

    <!-- نموذج استعادة كلمة المرور (نسيت كلمة المرور) -->
    <div class="card hidden" id="forgotCard">
        <h2>🔑 استعادة كلمة المرور</h2>
        <p style="color: #666; margin-bottom: 20px; font-size: 14px;">أدخل الرقم الشخصي والبريد الإلكتروني المسجل للتحقق.</p>
        <div class="form-group">
            <label>الرقم الشخصي:</label>
            <input type="text" id="forgotCpr" placeholder="أدخل الرقم الشخصي">
        </div>
        <div class="form-group">
            <label>البريد الإلكتروني المسجل:</label>
            <input type="email" id="forgotEmail" placeholder="أدخل بريدك الإلكتروني">
        </div>
        <div class="form-group">
            <label>كلمة المرور الجديدة:</label>
            <input type="password" id="forgotNewPass" placeholder="كلمة المرور الجديدة">
        </div>
        <button class="btn" id="verifyForgotBtn">تحديث كلمة المرور 🔄</button>
        <a class="back-link" onclick="showLoginCard()">← العودة لتسجيل الدخول</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            function setupToggle(toggleId, inputId) {
                const toggle = document.getElementById(toggleId);
                const input = document.getElementById(inputId);
                if (toggle && input) {
                    toggle.addEventListener('click', () => {
                        if (input.type === "password") { input.type = "text"; toggle.textContent = "🙈"; }
                        else { input.type = "password"; toggle.textContent = "👁️"; }
                    });
                }
            }
            setupToggle('toggleStaffPass', 'staffPass');
            setupToggle('toggleNewPass', 'newPass');
            setupToggle('toggleConfirmPass', 'confirmPass');

            let tempStaffData = null;

            document.getElementById('loginBtn').addEventListener('click', async () => {
                const inputVal = document.getElementById('staffEmail').value.trim();
                const pass = document.getElementById('staffPass').value.trim();
                if(!inputVal || !pass) { alert('الرجاء إدخال البيانات!'); return; }

                const { data, error } = await supabaseClient.from('staff').select('*').or(`username.eq.${inputVal},cpr.eq.${inputVal},email.eq.${inputVal}`).maybeSingle();
                if (error || !data) { alert('خطأ: اسم المستخدم أو الرقم غير صحيح.'); return; }
                if (data.password !== pass) { alert('كلمة المرور غير صحيحة!'); return; }

                if (data.password === '0') {
                    tempStaffData = data;
                    document.getElementById('loginCard').classList.add('hidden');
                    document.getElementById('resetCard').classList.remove('hidden');
                    return;
                }

                localStorage.setItem('current_staff_user', JSON.stringify(data));
                window.location.href = 'dashboard.html';
            });

            document.getElementById('updatePassBtn').addEventListener('click', async () => {
                const newPass = document.getElementById('newPass').value.trim();
                const confirmPass = document.getElementById('confirmPass').value.trim();
                if(!newPass || newPass !== confirmPass) { alert('كلمتا المرور غير متطابقتين!'); return; }

                await supabaseClient.from('staff').update({ password: newPass }).eq('id', tempStaffData.id);
                alert('تم التحديث بنجاح!');
                const { data } = await supabaseClient.from('staff').select('*').eq('id', tempStaffData.id).single();
                localStorage.setItem('current_staff_user', JSON.stringify(data));
                window.location.href = 'dashboard.html';
            });

            document.getElementById('verifyForgotBtn').addEventListener('click', async () => {
                const cpr = document.getElementById('forgotCpr').value.trim();
                const email = document.getElementById('forgotEmail').value.trim();
                const newPass = document.getElementById('forgotNewPass').value.trim();
                if(!cpr || !email || !newPass) { alert('الرجاء تعبئة جميع الحقول!'); return; }

                const { data, error } = await supabaseClient.from('staff').select('*').eq('cpr', cpr).eq('email', email).maybeSingle();
                if(error || !data) { alert('البيانات غير مطابقة لسجلات المعلمين!'); return; }

                await supabaseClient.from('staff').update({ password: newPass }).eq('id', data.id);
                alert('تم تغيير كلمة المرور بنجاح! يمكنك تسجيل الدخول الآن.');
                showLoginCard();
            });
        });

        function showForgotCard() {
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('forgotCard').classList.remove('hidden');
        }
        function showLoginCard() {
            document.getElementById('forgotCard').classList.add('hidden');
            document.getElementById('resetCard').classList.add('hidden');
            document.getElementById('loginCard').classList.remove('hidden');
        }
    </script>
</body>
</html>
