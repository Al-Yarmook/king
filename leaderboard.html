<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الملوك والأبطال - ملك جدول الضرب</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #d81b60;
            --primary-hover: #ad1457;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 20px; }
        .container { max-width: 800px; width: 100%; text-align: center; margin: auto; }
        header { background: #ffffff; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; border-top: 5px solid var(--primary); }
        header h1 { color: var(--primary); font-size: 28px; font-weight: 900; margin-bottom: 5px; }
        
        .game-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: white; border: 2px solid var(--primary); color: var(--primary); padding: 10px 18px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; font-family: 'Cairo'; font-size: 15px; }
        .tab-btn.active, .tab-btn:hover { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(216,27,96,0.2); }

        .leaderboard-card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .lb-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .lb-table th { background: #f8fafc; padding: 12px; font-size: 15px; color: #475569; border-bottom: 2px solid #e2e8f0; text-align: right; }
        .lb-table td { padding: 12px; border-bottom: 1px dashed #e2e8f0; font-size: 15px; text-align: right; }
        .lb-table tr:nth-child(1) td { font-weight: bold; color: #d97706; font-size: 17px; }
        
        .btn { background: var(--primary); color: white; border: none; padding: 10px 25px; font-size: 15px; font-weight: bold; border-radius: 10px; cursor: pointer; transition: 0.3s; text-decoration: none; display: inline-block; font-family: 'Cairo'; }
        .btn:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .btn-dark { background: #334155; }
        
        footer.author-footer { text-align: center; padding: 15px; font-size: 14px; color: #475569; border-top: 1px solid #e2e8f0; background: #ffffff; font-weight: bold; width: 100%; border-radius: 10px; margin-top: 25px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🏆 لوحة ملوك وفرسان جدول الضرب</h1>
            <p style="color: #64748b;">قائمة الشرف لأعلى الأبطال تحصيلاً للنقاط في الألعاب</p>
        </header>

        <!-- تبويبات الألعاب الثلاث -->
        <div class="game-tabs">
            <button class="tab-btn active" onclick="switchGameTab('rocket')">🚀 صواريخ الفضاء</button>
            <button class="tab-btn" onclick="switchGameTab('goldmine')">⛏️ منجم الذهب</button>
            <button class="tab-btn" onclick="switchGameTab('mountain')">🧗‍♂️ الصعود نحو القمة</button>
        </div>

        <div class="leaderboard-card">
            <h2 id="tabTitle" style="color: var(--primary); margin-bottom: 15px; font-size: 20px;">🏆 متصدرو صواريخ الفضاء</h2>
            <div id="tableContainer">جاري تحميل أبطال السحابة...</div>
        </div>

        <div style="margin-top: 25px;">
            <a href="index.html" class="btn btn-dark">🏠 العودة للرئيسية</a>
        </div>
    </div>

    <footer class="author-footer">
        إعداد أ. صادق القلعاوي | مدرسة اليرموك الابتدائية للبنين 🏫✨
    </footer>

    <script>
        let currentTab = 'rocket';

        function toArabicNum(num) {
            const arabicNumbers = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
            return String(num).replace(/\d/g, (d) => arabicNumbers[d]);
        }

        function switchGameTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (tab === 'rocket') {
                document.getElementById('tabTitle').textContent = '🚀 متصدرو سباق صواريخ الفضاء';
                fetchLeaderboard('rocket_scores');
            } else if (tab === 'goldmine') {
                document.getElementById('tabTitle').textContent = '⛏️ متصدرو لغز منجم الذهب';
                fetchLeaderboard('goldmine_scores');
            } else if (tab === 'mountain') {
                document.getElementById('tabTitle').textContent = '🧗‍♂️ متصدرو الصعود نحو القمة';
                fetchLeaderboard('mountain_scores');
            }
        }

        async function fetchLeaderboard(tableName) {
            const container = document.getElementById('tableContainer');
            container.innerHTML = '<p style="color:#64748b;">جاري جلب قائمة الأبطال...</p>';

            try {
                const { data, error } = await supabaseClient
                    .from(tableName)
                    .select('student_name, cls, points')
                    .order('points', { ascending: false })
                    .limit(10);

                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = '<p style="color:#64748b;">لا توجد نتائج مسجلة في هذه اللعبة حتى الآن.</p>';
                    return;
                }

                let html = `
                    <table class="lb-table">
                        <thead>
                            <tr>
                                <th>المركز</th>
                                <th>اسم البطل</th>
                                <th>الصف</th>
                                <th>مجموع النقاط</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                data.forEach((row, idx) => {
                    let medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : toArabicNum(idx + 1);
                    html += `
                        <tr>
                            <td>${medal}</td>
                            <td>${row.student_name || 'بطل'}</td>
                            <td>${row.cls || 'غير محدد'}</td>
                            <td><b>${toArabicNum(row.points || 0)}</b> نقطة</td>
                        </tr>
                    `;
                });

                html += '</tbody></table>';
                container.innerHTML = html;

            } catch (err) {
                container.innerHTML = '<p style="color:#ef5350;">تعذر تحميل النتائج حالياً.</p>';
            }
        }

        // التحميل الافتراضي للعبة الأولى
        fetchLeaderboard('rocket_scores');
    </script>
</body>
</html>
